name: ✨ Feature Request
description: Suggest an improvement to an existing workflow template
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve an existing template? We'd love to hear it!

  - type: dropdown
    id: template
    attributes:
      label: Related Template
      description: Which template does this relate to?
      options:
        - "secrets-scanner.yml"
        - "dependency-vulnerability-checker.yml"
        - "license-compliance-checker.yml"
        - "docker-build-push.yml"
        - "db-schema-migrator.yml"
        - "static-site-deployment.yml"
        - "stale-issue-closer.yml"
        - "reusable-agentops.yml"
        - "codeql-advanced-analysis.yml"
        - "pagerduty-siem-alerting.yml"
        - "github-oauth-login.yml"
        - "General / Cross-template"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What limitation are you running into?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
