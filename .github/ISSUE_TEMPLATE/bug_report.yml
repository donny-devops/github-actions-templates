name: 🐛 Bug Report
description: Report a bug in an existing workflow template
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: dropdown
    id: template
    attributes:
      label: Affected Template
      description: Which workflow template is affected?
      options:
        - "secrets-scanner.yml"
        - "dependency-vulnerability-checker.yml"
        - "license-compliance-checker.yml"
        - "docker-build-push.yml"
        - "db-schema-migrator.yml"
        - "static-site-deployment.yml"
        - "stale-issue-closer.yml"
        - "reusable-agentops.yml"
        - "codeql-advanced-analysis.yml"
        - "pagerduty-siem-alerting.yml"
        - "github-oauth-login.yml"
        - "Other / Multiple"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I use the template with X config, step Y fails with error Z..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Copy the template into `.github/workflows/`
        2. Configure with '...'
        3. Trigger the workflow via '...'
        4. See error in step '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Workflow Logs
      description: Paste relevant workflow run logs or a link to the failed run.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any relevant environment details.
      value: |
        - Runner OS: (e.g., `ubuntu-latest`)
        - Node/Python version: (if applicable)
        - GitHub Actions runner type: (hosted / self-hosted)
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am using the latest version of the template from this repository
          required: true
