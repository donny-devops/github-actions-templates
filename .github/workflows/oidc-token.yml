name: Inspect OIDC Token Claims

on:
  workflow_dispatch:
    inputs:
      audience:
        description: OIDC token audience
        required: false
        default: sts.amazonaws.com
        type: string

jobs:
  inspect-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Request and decode OIDC token claims
        shell: bash
        env:
          AUDIENCE: ${{ inputs.audience }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value' <<< "$response")"
          printf '::add-mask::%s\n' "$token"

          payload="$(cut -d '.' -f 2 <<< "$token" | tr '_-' '/+')"
          case $((${#payload} % 4)) in
            2) payload+='==' ;;
            3) payload+='=' ;;
          esac
          printf '%s' "$payload" | base64 --decode | jq -e 'select(.iss == "https://token.actions.githubusercontent.com")'
