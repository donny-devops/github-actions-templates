name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: Gitleaks release to install
        required: false
        type: string
        default: "8.30.1"
      config-path:
        description: Optional .gitleaks.toml path
        required: false
        type: string
        default: ""
      fail-on-findings:
        description: Fail the job when Gitleaks reports credentials
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set -euo pipefail
          args=(git . --verbose --redact)
          if [ -n "${CONFIG_PATH}" ]; then
            args+=(--config "${CONFIG_PATH}")
          elif [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          if [ "${FAIL_ON_FINDINGS}" != "true" ]; then
            args+=(--exit-code 0)
          fi
          gitleaks "${args[@]}"
