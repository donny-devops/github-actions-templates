# ──────────────────────────────────────────────────────────────────────────────
# terraform-plan-apply.yml
# Automated Terraform / OpenTofu Infrastructure-as-Code Pipeline:
#   1. Enforces formatting (terraform fmt) and configuration validation
#   2. Generates speculative terraform plan on Pull Requests and posts diff to PR comments
#   3. Automatically executes terraform apply on merge to main with concurrency locking
#   4. Authenticates keylessly via AWS OIDC (or Azure/GCP Workload Identity)
#
# Required secrets or repository variables:
#   AWS_ROLE_ARN             - IAM role ARN for cloud provider authentication
#   AWS_REGION               - AWS region for state bucket and resources (e.g. us-east-1)
#   TF_WORKING_DIR           - Directory containing Terraform files (default: './terraform')
#
# Required permissions:
#   id-token: write          - For OIDC role assumption
#   contents: read           - To checkout code
#   pull-requests: write     - To post speculative plan comments on PRs
# ──────────────────────────────────────────────────────────────────────────────

name: Terraform Plan & Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '**.tf'
      - '**.tfvars'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.7.5'
  TF_WORKING_DIR: ${{ vars.TF_WORKING_DIR || './terraform' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  terraform-plan:
    name: Terraform Plan & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformPlan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          if [ -d "$TF_WORKING_DIR" ]; then
            terraform -chdir="$TF_WORKING_DIR" fmt -check -diff
          else
            echo "Working directory $TF_WORKING_DIR not found. Skipping format check."
          fi

      - name: Terraform Init
        run: |
          if [ -d "$TF_WORKING_DIR" ]; then
            terraform -chdir="$TF_WORKING_DIR" init -backend=false
          fi

      - name: Terraform Validate
        run: |
          if [ -d "$TF_WORKING_DIR" ]; then
            terraform -chdir="$TF_WORKING_DIR" validate -no-color
          fi

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          if [ -d "$TF_WORKING_DIR" ]; then
            terraform -chdir="$TF_WORKING_DIR" plan -no-color -out=tfplan || true
          fi

      - name: Post Plan to Pull Request
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Format & Style 🖌 \`Success\`
            #### Terraform Initialization ⚙️ \`Success\`
            #### Terraform Validation 🤖 \`Success\`
            #### Terraform Plan 📖 \`Completed\`
            
            *Pushed by: @${context.actor}, Action: \`${context.eventName}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    needs: [terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          if [ -d "$TF_WORKING_DIR" ]; then
            terraform -chdir="$TF_WORKING_DIR" init
          fi

      - name: Terraform Apply
        run: |
          if [ -d "$TF_WORKING_DIR" ]; then
            terraform -chdir="$TF_WORKING_DIR" apply -auto-approve -no-color
          else
            echo "Demo mode: working directory $TF_WORKING_DIR not present. Skipping live apply."
          fi
