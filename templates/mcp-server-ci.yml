# ──────────────────────────────────────────────────────────────────────────────
# mcp-server-ci.yml
# Quality gate for Model Context Protocol servers (Node or Python).
#
# Detects:
#   - package.json with an mcp dependency or bin
#   - Python modules named mcp_server / mcp
#
# Required secrets: none
# ──────────────────────────────────────────────────────────────────────────────

name: MCP Server CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-quality:
    name: MCP lint, test, and tool inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect MCP server layout
        id: detect
        run: |
          set -euo pipefail
          node=false
          python=false
          if [ -f package.json ] && grep -Eqi '"mcp"|@modelcontextprotocol' package.json; then
            node=true
          fi
          if find . -maxdepth 4 \( -name 'mcp_server.py' -o -name 'mcp-server.ts' -o -name 'mcp.ts' -o -name 'server.ts' \) | grep -q .; then
            if [ -f pyproject.toml ] || [ -f requirements.txt ]; then python=true; fi
            if [ -f package.json ]; then node=true; fi
          fi
          echo "node=${node}" >> "$GITHUB_OUTPUT"
          echo "python=${python}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Node install, lint, and test
        if: steps.detect.outputs.node == 'true'
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python install, lint, and test
        if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [ -f pyproject.toml ]; then python -m pip install -e '.[dev]' || python -m pip install -e . || true; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt || true; fi
          ruff check . --output-format=github
          if [ -d tests ]; then pytest; fi

      - name: Inventory MCP tools
        run: |
          set -euo pipefail
          {
            echo "## MCP server CI"
            echo
            echo "- Node detected: \`${{ steps.detect.outputs.node }}\`"
            echo "- Python detected: \`${{ steps.detect.outputs.python }}\`"
            echo
            echo "### Tool/module candidates"
            echo '```'
            find . -maxdepth 5 \( -name '*mcp*' -o -name '*tool*' \) \
              -not -path './.git/*' -not -path './node_modules/*' | sort | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
