# ──────────────────────────────────────────────────────────────────────────────
# cloudflare-workers-ci.yml
# Lint, test, and dry-run deploy a Cloudflare Worker / Vite project.
#
# Required secrets: none for CI dry-run
# Optional secrets for production deploy (not enabled here):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# ──────────────────────────────────────────────────────────────────────────────

name: Cloudflare Workers CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    name: Worker quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Wrangler dry-run
        if: ${{ hashFiles('wrangler.toml', 'wrangler.json', 'wrangler.jsonc') != '' }}
        run: npx wrangler deploy --dry-run
