# ──────────────────────────────────────────────────────────────────────────────
# release-changelog-automation.yml
# Automated Release & Changelog Workflow:
#   1. Determines release type or extracts semantic version from tag
#   2. Automatically compiles structured release notes and changelog from commit log / PRs
#   3. Generates GitHub Release with release notes and attaches binary/package artifacts
#
# Triggers:
#   - Pushing a version tag matching 'v*.*.*'
#   - Manual dispatch with version and release bump options
#
# Required permissions:
#   contents: write          - To create Git tags and publish GitHub Releases
#   pull-requests: read      - To extract PR titles and authors for release notes
# ──────────────────────────────────────────────────────────────────────────────

name: Release & Changelog Automation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    name: Generate Release Notes & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version Tag
        id: version_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Targeting release tag: ${TAG}"

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version_info.outputs.tag }}';
            const { data: releaseNotes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag
            });
            core.setOutput('name', releaseNotes.name || `Release ${tag}`);
            core.setOutput('body', releaseNotes.body || 'Automated release generated by GitHub Actions.');

      # Optional: Compile binary or package distribution artifacts
      # - name: Build Release Assets
      #   run: |
      #     tar -czf release-assets.tar.gz dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: ${{ steps.release_notes.outputs.name }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          # files: release-assets.tar.gz
